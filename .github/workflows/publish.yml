name: Publish

# Publishes storeshot to PyPI with Trusted Publishing (OIDC: no token anywhere) and PEP 740
# attestations, from a GitHub-hosted runner. OFF until the repository variable PYPI_PUBLISH_ENABLED
# is 'true'. Runs on a pushed v* tag (which must equal the package version) or a manual dispatch,
# which is a dry run (build and checks, no upload) by default. Only the publish job can mint an
# OIDC token, and only inside the `pypi` environment (its reviewers approve each run).
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and check only (uploads nothing)'
        type: boolean
        default: true
  push:
    tags: ['v*']

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    if: vars.PYPI_PUBLISH_ENABLED == 'true' && github.repository == 'Draggable/storeshot-python'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.published.outputs.skip }}
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Package version matches the tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv run python -c 'import storeshot; print(storeshot.__version__)')
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::the package is $version, the tag is $TAG"
            exit 1
          fi

      - name: Every check
        run: |
          uv run python scripts/generate.py --check
          uv run ruff check . && uv run ruff format --check .
          uv run mypy
          uv run pytest
          uv run python scripts/check_dist.py

      - name: Build
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          uv build --out-dir dist

      # A re-run (or a dispatch) of a version that is already on PyPI uploads nothing.
      - name: Skip a version that is already published
        id: published
        run: |
          version=$(uv run python -c 'import storeshot; print(storeshot.__version__)')
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/storeshot/$version/json")
          if [[ "$code" == "200" ]]; then
            echo "::notice::storeshot $version is already on PyPI."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI (Trusted Publishing)
    needs: [build]
    if: needs.build.outputs.skip != 'true' && (github.event_name == 'push' || inputs.dry-run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/storeshot
    permissions:
      id-token: write
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
